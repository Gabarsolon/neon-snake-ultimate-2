<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04050d">
<title>Snake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2304050d'/%3E%3Cpath d='M14 46h20a8 8 0 0 0 0-16h-6a8 8 0 0 1 0-16h14' fill='none' stroke='%2321e6d2' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='46' r='5' fill='%23ffae35'/%3E%3C/svg%3E">
<style>
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root {
  --h1: 176; --h2: 256; --h3: 34;
  --ink: #04050d;
  --font: "Avenir Next", "Futura", "Century Gothic", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body {
  font-family: var(--font); color: #eef1ff;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
body[data-mode="playing"] { cursor: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; }

/* ── ambient light ── */
.aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 95vmax; height: 95vmax; border-radius: 50%; will-change: transform; }
.aurora i:nth-child(1) { left: -38vmax; top: -48vmax; background: radial-gradient(closest-side, hsla(var(--h1), 100%, 48%, .34), transparent); animation: drift-a 29s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { right: -40vmax; bottom: -52vmax; background: radial-gradient(closest-side, hsla(var(--h2), 100%, 58%, .34), transparent); animation: drift-b 37s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { left: 50%; top: 50%; width: 70vmax; height: 70vmax; margin: -35vmax; background: radial-gradient(closest-side, hsla(var(--h3), 100%, 55%, .09), transparent); animation: drift-c 43s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(22vmax, 14vmax) scale(1.25); } }
@keyframes drift-b { to { transform: translate(-20vmax, -12vmax) scale(1.18); } }
@keyframes drift-c { from { transform: translate(-18vmax, 8vmax) scale(.9); } to { transform: translate(18vmax, -8vmax) scale(1.2); } }

#c, #g { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
body.gl #c, body.gl .aurora, body.gl .vignette, body.gl .grain, body.gl .crt { display: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, .6) 100%); }
.grain { position: fixed; inset: 0; pointer-events: none; opacity: .7; }

/* ── hud ── */
.hud { position: fixed; z-index: 8; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding: 0 6px 15px; pointer-events: none; }
.stat { display: flex; flex-direction: column; gap: 6px; transition: opacity .45s ease; }
.stat small { font-size: 9.5px; font-weight: 700; letter-spacing: .36em; color: rgba(255, 255, 255, .42); }
.stat b { display: block; font-size: clamp(22px, 3.6vw, 30px); font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: .02em; transform-origin: 0 60%; text-shadow: 0 0 20px hsla(var(--h1), 100%, 60%, .6); }
.stat.r { align-items: flex-end; margin-right: 8px; }
.stat.r b { transform-origin: 100% 60%; }
.hud .right { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; }
.bump { animation: bump .34s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { 35% { transform: scale(1.24); } }

/* ── odometer: every digit is a reel of 0-9 sliding behind a window ── */
.od .d { display: inline-block; overflow: hidden; height: 1em; line-height: 1; vertical-align: top; }
.od .r { display: block; transition: transform .45s cubic-bezier(.3, 1.15, .35, 1); }
.od .r i { display: block; height: 1em; line-height: 1; font-style: normal; }
.stat b.od { text-shadow: none; filter: drop-shadow(0 0 16px hsla(var(--h1), 100%, 60%, .55)); }
.final.od i { background: linear-gradient(180deg, #fff 12%, hsl(var(--h1), 100%, 66%) 52%, hsl(var(--h2), 100%, 60%) 96%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }

.combo { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px) scale(.85); transition: opacity .3s ease, transform .35s cubic-bezier(.2, 1.5, .4, 1); }
.combo.on { opacity: 1; transform: none; }
.combo b { display: block; font-size: 21px; font-weight: 800; line-height: .9; letter-spacing: .03em; color: hsl(var(--h3), 100%, 72%); text-shadow: 0 0 18px hsla(var(--h3), 100%, 55%, .9); }
.combo .bar { display: block; width: clamp(64px, 14vw, 112px); height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.combo .bar i { display: block; width: 100%; height: 100%; border-radius: inherit; transform-origin: 0 50%; background: linear-gradient(90deg, hsl(var(--h3), 100%, 60%), #fff); }
body.fever .stat b.od { filter: drop-shadow(1.5px 0 0 rgba(255, 0, 60, .5)) drop-shadow(-1.5px 0 0 rgba(0, 229, 255, .5)) drop-shadow(0 0 16px hsla(var(--h1), 100%, 60%, .8)); }
body.fever .combo b { text-shadow: 1.5px 0 0 rgba(255, 0, 60, .5), -1.5px 0 0 rgba(0, 229, 255, .5), 0 0 22px hsla(var(--h3), 100%, 60%, 1); }
body.fever .aurora i { animation-duration: 17s; }

.icon { pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); color: rgba(255, 255, 255, .75); transition: transform .2s ease, background .2s ease, color .2s ease, opacity .45s ease; }
.icon:hover { background: rgba(255, 255, 255, .13); color: #fff; transform: scale(1.1); }
.icon:active { transform: scale(.94); }
.icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon .off, body.muted #btnSound .on, body[data-mode="paused"] #btnPause .on { display: none; }
body.muted #btnSound .off, body[data-mode="paused"] #btnPause .off { display: inline; }
body[data-mode="menu"] .hud .stat, body[data-mode="over"] .hud .stat,
body[data-mode="menu"] #btnPause, body[data-mode="over"] #btnPause { opacity: 0; pointer-events: none; }

/* ── overlays ── */
.overlay { position: fixed; inset: 0; z-index: 6; display: grid; overflow-y: auto; padding: 24px; text-align: center; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .5s ease, visibility 0s linear .5s; }
.overlay::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(4, 5, 13, .3) 0%, rgba(4, 5, 13, .8) 78%); -webkit-backdrop-filter: blur(3px) saturate(1.15); backdrop-filter: blur(3px) saturate(1.15); }
#menu::before { background: radial-gradient(ellipse at 50% 46%, rgba(4, 5, 13, .22) 0%, rgba(4, 5, 13, .66) 80%); -webkit-backdrop-filter: blur(1.5px) saturate(1.15); backdrop-filter: blur(1.5px) saturate(1.15); }
.panel { position: relative; margin: auto; display: flex; flex-direction: column; align-items: center; transform: translateY(18px) scale(.96); transition: transform .7s cubic-bezier(.16, 1, .3, 1); }
body[data-mode="menu"] #menu, body[data-mode="paused"] #pause, body[data-mode="over"] #over { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
body[data-mode="menu"] #menu .panel, body[data-mode="paused"] #pause .panel, body[data-mode="over"] #over .panel { transform: none; }

.logo { --rx: 0deg; --ry: 0deg; display: flex; font-size: clamp(60px, 17vw, 184px); font-weight: 800; line-height: 1; letter-spacing: .07em; padding-left: .07em; filter: drop-shadow(0 0 32px hsla(var(--h1), 100%, 55%, .5)); transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .5s cubic-bezier(.2, .8, .3, 1); }
.logo span { --a: hsl(176, 100%, 68%); --b: hsl(226, 100%, 58%); --d: 0s; display: inline-block;
  background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, .9) 50%, transparent 58%) 160% 0 / 260% 100% no-repeat, linear-gradient(180deg, #fff 10%, var(--a) 48%, var(--b) 94%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: rise 1.1s cubic-bezier(.16, 1, .3, 1) var(--d) both, ignite 1.5s linear var(--d) both, shine 5.5s ease-in-out calc(var(--d) + 1.6s) infinite; }
.logo span:nth-child(1) { --d: .05s; } .logo span:nth-child(2) { --d: .32s; } .logo span:nth-child(3) { --d: .16s; }
.logo span:nth-child(4) { --d: .46s; } .logo span:nth-child(5) { --d: .24s; }
@keyframes rise { from { transform: translateY(.3em) scale(.92); } }
@keyframes ignite { 0%, 6% { opacity: 0; } 8% { opacity: 1; } 11% { opacity: .1; } 15% { opacity: .85; } 17% { opacity: .25; } 22%, 100% { opacity: 1; } }
@keyframes shine { 0%, 62% { background-position: 160% 0, 0 0; } 100% { background-position: -60% 0, 0 0; } }

.cta { position: relative; margin-top: clamp(26px, 6vh, 54px); padding: 17px 50px 17px 58px; border: 2px solid transparent; border-radius: 999px; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: .44em; color: #fff;
  background: linear-gradient(#090b1a, #0c0f24) padding-box, conic-gradient(from var(--ang), hsl(var(--h1), 100%, 60%), hsl(var(--h2), 100%, 68%), hsl(var(--h3), 100%, 60%), hsl(var(--h1), 100%, 60%)) border-box;
  box-shadow: 0 0 34px hsla(var(--h1), 100%, 55%, .38), inset 0 0 20px hsla(var(--h2), 100%, 62%, .16);
  animation: spin 5s linear infinite; transition: transform .25s cubic-bezier(.2, 1.5, .4, 1), box-shadow .25s ease; }
.cta:hover { transform: scale(1.06); box-shadow: 0 0 52px hsla(var(--h1), 100%, 55%, .6), inset 0 0 26px hsla(var(--h2), 100%, 62%, .28); }
.cta:active { transform: scale(.97); }
@keyframes spin { to { --ang: 360deg; } }

.keys { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 24px; font-size: 10.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: rgba(255, 255, 255, .46); }
.keys span { display: inline-flex; align-items: center; }
kbd { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px; margin-right: 4px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .06); box-shadow: 0 2px 0 rgba(255, 255, 255, .07); font: 600 11px/1 var(--font); letter-spacing: .06em; color: rgba(255, 255, 255, .86); }
kbd:last-of-type { margin-right: 10px; }
.keys.touch, .mob { display: none; }
body.coarse .keys { display: none; } body.coarse .keys.touch { display: flex; }
body.coarse .desk { display: none; } body.coarse .mob { display: inline; }
.record { margin-top: 22px; min-height: 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .36em; color: hsl(var(--h3), 100%, 72%); text-shadow: 0 0 16px hsla(var(--h3), 100%, 55%, .7); }

.paused { font-size: clamp(32px, 8vw, 76px); font-weight: 300; letter-spacing: .5em; padding-left: .5em; text-shadow: 0 0 30px hsla(var(--h1), 100%, 60%, .75); }
.sub { margin-top: 20px; font-size: 10.5px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: rgba(255, 255, 255, .5); }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .62em; padding-left: .62em; color: hsl(348, 100%, 72%); text-shadow: 0 0 18px hsla(348, 100%, 60%, .85); }
.final { margin-top: 10px; font-size: clamp(72px, 17vw, 168px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .01em; filter: drop-shadow(0 0 30px hsla(var(--h1), 100%, 55%, .5)); }
.newbest { margin-top: 6px; padding: 7px 14px 7px 18px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .36em; color: #1d1300; background: linear-gradient(90deg, #ffe08a, #ff9f43); box-shadow: 0 0 28px rgba(255, 190, 80, .65); transform: scale(0); max-height: 0; padding-block: 0; transition: transform .5s cubic-bezier(.2, 1.6, .4, 1) .55s; }
.newbest.on { transform: scale(1); max-height: 40px; padding-block: 7px; }
.stats { display: flex; gap: clamp(24px, 6vw, 58px); margin-top: 28px; }
.stats div { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.stats b { font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stats small { font-size: 9px; font-weight: 700; letter-spacing: .34em; padding-left: .34em; color: rgba(255, 255, 255, .42); }

/* ── overdrive meter ── */
.hud .left { display: flex; align-items: flex-end; gap: 34px; }
.meter { display: flex; flex-direction: column; gap: 8px; padding-bottom: 2px; transition: opacity .45s ease; }
.meter small { font-size: 9.5px; font-weight: 700; letter-spacing: .3em; color: rgba(255, 255, 255, .42); transition: color .2s ease; }
.meter .bar { display: block; width: clamp(70px, 9vw, 112px); height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: inherit; transform-origin: 0 50%; background: linear-gradient(90deg, hsl(var(--h1), 100%, 60%), hsl(var(--h2), 100%, 72%)); box-shadow: 0 0 10px hsla(var(--h1), 100%, 60%, .8); }
body.boosting .meter .bar i { background: linear-gradient(90deg, #ff2d7a, #ffd25a); }
body.boosting .meter small { color: #ff9ac4; }
body[data-mode="menu"] .meter, body[data-mode="over"] .meter { opacity: 0; }
body.coarse .meter { display: none; }

/* ── settings ── */
.settings { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.themes { display: flex; flex-wrap: wrap; justify-content: center; gap: 11px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); transition: transform .2s cubic-bezier(.2, 1.6, .4, 1), box-shadow .2s ease; }
.swatch:hover { transform: scale(1.15); }
.swatch.on { transform: scale(1.24); box-shadow: 0 0 0 2px #fff, 0 0 18px var(--glow); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 660px; }
.chip { display: inline-flex; align-items: baseline; gap: 7px; padding: 8px 13px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); font-size: 9.5px; font-weight: 700; letter-spacing: .22em; color: rgba(255, 255, 255, .5); transition: background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease; }
.chip b { font-weight: 800; color: #fff; letter-spacing: .16em; }
.chip:hover { background: rgba(255, 255, 255, .12); color: rgba(255, 255, 255, .8); }
.chip.on { border-color: hsla(var(--h1), 100%, 65%, .7); box-shadow: 0 0 14px hsla(var(--h1), 100%, 60%, .3); }
.theme-name { min-height: 12px; font-size: 9.5px; font-weight: 700; letter-spacing: .34em; color: rgba(255, 255, 255, .45); }

/* ── combo banner ── */
.banner { position: fixed; z-index: 7; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; opacity: 0; }
.banner b { font-size: clamp(34px, 7vw, 74px); font-weight: 800; letter-spacing: .06em; line-height: 1.05; background: linear-gradient(90deg, hsl(var(--h3), 100%, 66%), #fff 50%, hsl(var(--h1), 100%, 68%)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; filter: drop-shadow(0 0 24px hsla(var(--h3), 100%, 55%, .85)); }
.banner small { font-size: 12px; font-weight: 800; letter-spacing: .5em; padding-left: .5em; color: #fff; text-shadow: 0 0 14px hsla(var(--h3), 100%, 60%, .9); }
.banner.go { animation: banner 1.7s cubic-bezier(.2, 1, .3, 1) both; }
@keyframes banner { 0% { opacity: 0; transform: scale(.4); } 14% { opacity: 1; transform: scale(1.12); } 24% { transform: scale(1); } 72% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-26px) scale(.96); } }

/* ── crt ── */
.crt { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .4s ease;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .26) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 56%, rgba(0, 0, 0, .72) 100%);
  box-shadow: inset 0 0 140px rgba(0, 0, 0, .6); }
body.crt-on .crt { opacity: 1; animation: flicker .14s steps(2) infinite; }
@keyframes flicker { 50% { opacity: .84; } }

/* ── game over extras ── */
.stats { flex-wrap: wrap; justify-content: center; row-gap: 18px; }
.top { margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.top small { font-size: 9px; font-weight: 700; letter-spacing: .34em; padding-left: .34em; color: rgba(255, 255, 255, .42); margin-bottom: 2px; }
.top div { display: flex; gap: 18px; font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, .62); }
.top div i { font-style: normal; color: rgba(255, 255, 255, .32); }
.top div.me { color: hsl(var(--h3), 100%, 72%); text-shadow: 0 0 12px hsla(var(--h3), 100%, 55%, .7); }

/* ── touch deck: d-pad + overdrive ── */
.deck { --k: 44px; position: fixed; z-index: 8; display: none; align-items: center; justify-content: space-between; padding: 0 6px; transition: opacity .45s ease; }
body.coarse .deck { display: flex; }
body[data-mode="menu"] .deck, body[data-mode="over"] .deck { opacity: 0; visibility: hidden; }
.dpad { display: grid; grid-template-columns: repeat(3, var(--k)); grid-template-rows: repeat(3, var(--k)); gap: 5px; }
.dpad button { border-radius: 14px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .06); display: grid; place-items: center; transition: transform .08s ease, background .08s ease; }
.dpad button svg { width: 38%; height: 38%; fill: rgba(255, 255, 255, .82); }
.dpad button.hit { background: hsla(var(--h1), 100%, 60%, .38); transform: scale(.92); }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
.boost { --e: 1; position: relative; width: calc(var(--k) * 2.3); height: calc(var(--k) * 2.3); border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#ff2d7a calc(var(--e) * 360deg), rgba(255, 255, 255, .1) 0); box-shadow: 0 0 22px rgba(255, 45, 122, .3); transition: transform .1s ease, box-shadow .2s ease; }
.boost::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2a0f2a, #0b0c1d 70%); }
.boost span { position: relative; font-size: 11px; font-weight: 800; letter-spacing: .24em; padding-left: .24em; }
.boost.hot { transform: scale(.94); box-shadow: 0 0 38px rgba(255, 45, 122, .85); }

@media (max-width: 540px) { .hud .stat.r { display: none; } .keys { gap: 10px 16px; } }
@media (max-height: 640px) {
  .logo { font-size: clamp(48px, 14vh, 100px); }
  .cta { margin-top: 18px; padding-top: 14px; padding-bottom: 14px; }
  .keys { margin-top: 16px; }
  .settings { margin-top: 14px; gap: 9px; }
  .final { font-size: clamp(54px, 16vh, 112px); margin-top: 4px; }
  .stats { margin-top: 14px; row-gap: 10px; }
  .top { margin-top: 10px; gap: 3px; }
  .record { margin-top: 10px; }
}
@media (prefers-reduced-motion: reduce) { .aurora i, .cta, .logo span { animation: none; } .logo { transform: none; } }
</style>
</head>
<body data-mode="menu">

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="c"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" id="grain" aria-hidden="true"></div>

<header class="hud" id="hud">
  <div class="left">
    <div class="stat"><small>SCORE</small><b id="score" class="od">0</b></div>
    <div class="meter"><small>OVERDRIVE</small><span class="bar"><i id="energy"></i></span></div>
  </div>
  <div class="combo" id="combo"><b id="comboX">×1</b><span class="bar"><i id="comboBar"></i></span></div>
  <div class="right">
    <div class="stat r"><small>BEST</small><b id="best">0</b></div>
    <button class="icon" id="btnSound" tabindex="-1" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><g class="on"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g class="off"><path d="m16 9 5 6m0-6-5 6"/></g></svg>
    </button>
    <button class="icon" id="btnPause" tabindex="-1" aria-label="Pause">
      <svg viewBox="0 0 24 24"><g class="on"><path d="M8 5v14M16 5v14"/></g><g class="off"><path d="M8 5l11 7-11 7z"/></g></svg>
    </button>
  </div>
</header>

<div class="banner" id="banner"><b id="bannerT"></b><small id="bannerS"></small></div>
<div class="crt" aria-hidden="true"></div>

<nav class="deck" id="deck">
  <div class="dpad">
    <button class="u" data-d="0,-1" tabindex="-1" aria-label="Up"><svg viewBox="0 0 10 10"><path d="M5 1.5 9 8H1z"/></svg></button>

<script>
(() => {
'use strict';

// ── helpers ─────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const { min, max, abs, sin, cos, exp, sqrt, floor, round, ceil, atan2, hypot, PI } = Math;
const TAU = PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => floor(rnd(a, b + 1));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const outCubic = (t) => 1 - (1 - t) ** 3;
const outBack = (t) => 1 + 2.9 * (t - 1) ** 3 + 1.9 * (t - 1) ** 2;
const wrap360 = (h) => ((h % 360) + 360) % 360;
const hsla = (h, s, l, a = 1) => `hsla(${wrap360(h).toFixed(1)},${s}%,${l.toFixed(1)}%,${a.toFixed(3)})`;
// move a toward b by t along the shortest way around a circle of size `full`
const turnTo = (a, b, t, full) => a + ((((b - a) % full) + full * 1.5) % full - full / 2) * t;

const store = {
  get(k, d) { try { const v = localStorage.getItem('neon-snake.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('neon-snake.' + k, String(v)); } catch (e) {} },
};

const coarse = matchMedia('(pointer: coarse)').matches;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Avenir Next","Futura","Century Gothic","Segoe UI",system-ui,sans-serif';
const HUE0 = 176;        // head hue at the start of a run
const SPREAD = 112;      // hue travelled along the body
const FOOD_SHIFT = 218;  // food hue relative to the head
const PAD = 0.16;        // board padding around the grid, in cells
const BLOOM = 1.5;       // halo laid under the scene
const HEAT = 0.1;        // bloom added back on top
const GOLD = 46;         // hue of golden food

// ── looks & options ─────────────────────────────────────────────────────
// palettes list body hues from head to tail, then the hue of the food and of the nova star
const THEMES = [
  { id: 'spectrum', name: 'SPECTRUM', sw: 'conic-gradient(#20f0d8, #4a7dff, #c14dff, #ff4f8b, #ffb238, #20f0d8)' },
  { id: 'rainbow', name: 'RAINBOW CHASE', sw: 'conic-gradient(#ff3b3b, #ffe53b, #3bff6a, #3bf0ff, #3b5bff, #ff3bf5, #ff3b3b)' },
  { id: 'cyber', name: 'CYBER NEON', body: [182, 271, 330], food: 330, nova: 49 },
  { id: 'synthwave', name: 'SYNTHWAVE SUNSET', body: [330, 272, 409], food: 49, nova: 182 },
  { id: 'matrix', name: 'EMERALD MATRIX', body: [152, 186, 217], food: 186, nova: 55 },
  { id: 'solar', name: 'SOLAR FLARE', body: [36, -20, -88], food: 340, nova: 182 },
  { id: 'amethyst', name: 'ROYAL AMETHYST', body: [281, 266, 182], food: 182, nova: 49 },
];
const PACES = [{ name: 'CHILL', k: 0.8 }, { name: 'NORMAL', k: 1 }, { name: 'INSANE', k: 1.3 }];
const opts = {
  theme: THEMES.find((t) => t.id === store.get('theme', 'spectrum')) || THEMES[0],
  portal: store.get('walls', 'solid') === 'portal',
  pace: clamp(parseInt(store.get('pace', '1'), 10) || 0, 0, PACES.length - 1),
  crt: store.get('crt', '0') === '1',
};

// hue along a palette, t = 0 at the head .. 1 at the tail
function paletteHue(stops, t) {
  const k = clamp(t, 0, 1) * (stops.length - 1), i = min(floor(k), stops.length - 2);
  return stops[i] + (stops[i + 1] - stops[i]) * (k - i);
}

// ── audio: synthesised music + sfx, no assets ───────────────────────────
const audio = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const BPM0 = 104;                       // the tempo climbs with the combo, like the heat
  // [bass, ...arp notes] as midi — Am9, Fmaj9, Cmaj7, G6/9
  const CHORDS = [[45, 57, 60, 64, 67, 71], [41, 53, 57, 60, 64, 67], [48, 55, 60, 64, 67, 71], [43, 55, 59, 62, 67, 69]];
  const ARP = [[0, 1, 2, 3, 4, 3, 2, 1, 0, 1, 2, 3, 4, 3, 2, 1], [0, 2, 1, 3, 2, 4, 3, 2, 0, 2, 1, 3, 4, 3, 2, 1]];
  const SCALE = [69, 72, 74, 76, 79, 81, 84, 86, 88];
  const KEYS = [0, 2, -1, 3];              // the loop turns over into a new key every fourth phrase
  const LEAD = [5, 4, 3, 4];               // the answer: the top of the chord, falling home
  const hz = (m) => 440 * 2 ** ((m - 69) / 12);
  let ac = null, master, sfx, mus, lp, send, noise, melo, drums, pump;
  let muted = store.get('muted', '0') === '1', scene = 'menu', heat = 0, stepI = 0, nextT = 0, beatAt = 0, bpm = BPM0;
  let sfxOn = store.get('sfx', '1') === '1', musicOn = store.get('music', '1') === '1', rush = null;
  let keyT = 0, chT = CHORDS[0], rushOn = false;
  const stepLen = () => 15 / bpm;

  function init() {
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.18;
    master.connect(comp); comp.connect(ac.destination);
    sfx = ac.createGain(); sfx.gain.value = sfxOn ? 0.9 : 0; sfx.connect(master);
    lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6; lp.frequency.value = 1000; lp.connect(master);
    mus = ac.createGain(); mus.gain.value = 0.5; mus.connect(lp);
    // melodic parts duck under every kick (sidechain pump); drums stay on top
    pump = ac.createGain(); pump.connect(mus);
    melo = ac.createGain(); melo.connect(pump);
    drums = ac.createGain(); drums.connect(mus);
    send = ac.createGain(); send.gain.value = 0.45;
    // a generated hall: stereo noise that dies away over a couple of seconds
    const verb = ac.createConvolver(), len = (ac.sampleRate * 2.6) | 0, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
    verb.buffer = ir;
    const wet = ac.createGain(), room = ac.createGain(); wet.gain.value = 0.34; room.gain.value = 0.2;
    verb.connect(wet); wet.connect(lp); send.connect(verb); melo.connect(room); room.connect(verb);
    const dl = ac.createDelay(1), fb = ac.createGain(), tone = ac.createBiquadFilter();
    dl.delayTime.value = 45 / BPM0; fb.gain.value = 0.4; tone.type = 'lowpass'; tone.frequency.value = 2600;
    send.connect(dl); dl.connect(tone); tone.connect(fb); fb.connect(dl); tone.connect(lp);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ac.currentTime + 0.08;
    setInterval(schedule, 28);
    applyScene();
  }

  function voice(type, f, at, dur, vol, dest, o = {}) {
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, at);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, at + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + (o.attack || 0.005));
    if (o.hold) g.gain.setValueAtTime(vol, at + dur - o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    if (o.cut) {
      const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = o.q || 1;
      fl.frequency.setValueAtTime(o.cut, at);
      if (o.cutTo) fl.frequency.exponentialRampToValueAtTime(o.cutTo, at + dur);
      osc.connect(fl); fl.connect(g);
    } else osc.connect(g);
    let out = g;
    if (o.pan && ac.createStereoPanner) { const pn = ac.createStereoPanner(); pn.pan.value = clamp(o.pan, -1, 1); g.connect(pn); out = pn; }
    out.connect(dest); if (o.echo) out.connect(send);
    osc.start(at); osc.stop(at + dur + 0.05);
  }

  function hiss(at, dur, vol, type, f, dest, fTo, q) {
    const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noise; src.loop = true;
    fl.type = type; fl.Q.value = q || 0.7; fl.frequency.setValueAtTime(f, at);
    if (fTo) fl.frequency.exponentialRampToValueAtTime(fTo, at + dur);
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(fl); fl.connect(g); g.connect(dest);
    src.start(at, Math.random() * 0.8); src.stop(at + dur + 0.05);
  }

  // one sixteenth note of the backing track; layers come in with the action
  function playStep(i, at) {
    const s = i % 16, bar = (i >> 4) & 3, cycle = i >> 6, pat = ARP[cycle & 1];
    if (s === 0) {                          // a new key every fourth phrase, a chord every bar
      if (bar === 0) keyT = KEYS[(cycle >> 2) & 3];
      chT = CHORDS[bar].map((m) => m + keyT);
    }
    const ch = chT;
    if (s % 4 === 0) beatAt = at;
    if (!musicOn) return;                  // keep the clock for the visuals, skip the notes
    const lvl = scene !== 'playing' ? 0 : heat >= 4 ? 3 : heat >= 2 ? 2 : 1;
    const brk = lvl >= 1 && cycle % 8 === 7 && bar === 3;   // one bar of breath before the key turns
    if (s === 0) { const pd = lvl >= 3 ? 0.55 : 1;          // pads make room once the drums are in
      for (let k = 1; k <= 3; k++) voice('sawtooth', hz(ch[k]), at, stepLen() * 17, 0.024 * pd, melo, { attack: 0.45, hold: 0.7, cut: 850, detune: (k - 2) * 7, pan: (k - 2) * 0.55 });
    }
    if (lvl > 0 || s % 2 === 0) {
      const n = ch[1 + pat[s]] + ((lvl >= 3 && s % 4 === 2) || (rushOn && lvl >= 1) ? 12 : 0);
      voice('sawtooth', hz(n), at, 0.28, lvl ? 0.07 : 0.05, melo, { cut: lvl ? 2400 + heat * 250 : 1400, cutTo: 360, q: 5, echo: 1, pan: s % 2 ? 0.3 : -0.3 });
    }
    if (lvl >= 2 && bar === 3 && ((cycle & 1) === 0 || brk) && s % 4 === 0)   // the lead answers every other phrase
      voice('square', hz(ch[LEAD[s >> 2]] + 12), at, stepLen() * 3.2, brk ? 0.06 : 0.045, melo, { cut: 3000, attack: 0.03, echo: 1, pan: 0.18 });
    if (brk && s === 8) hiss(at, stepLen() * 7.5, 0.05, 'bandpass', 400, melo, 6000, 1.4);   // riser into the new key
    if (lvl >= 1) {
      if (s % 2 === 0 && !brk) voice('sawtooth', hz(ch[0] + (s === 14 ? 12 : 0)), at, 0.22, s % 4 === 0 ? 0.1 : 0.17, melo, { cut: 560, cutTo: 130, q: 2 });
      if (s % 4 === 0 && !brk) {
        voice('sine', 150, at, 0.26, 0.5, drums, { to: 40, glide: 0.11, attack: 0.002 });
        pump.gain.cancelScheduledValues(at); pump.gain.setValueAtTime(0.42, at); pump.gain.setTargetAtTime(1, at + 0.02, 0.085);
      }
    }
    if (lvl >= 2) {
      if (s % 4 === 2) hiss(at, 0.045, 0.05, 'highpass', 7500, drums);
      if (s === 4 || s === 12) hiss(at, 0.13, 0.085, 'bandpass', 1700, drums, 0, 1.1);
    }
    if (lvl >= 3 && s % 2 === 1) hiss(at, 0.025, 0.022, 'highpass', 9000, drums);
  }

  function schedule() {
    if (!ac || ac.state !== 'running') return;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.12) { playStep(stepI++, nextT); nextT += stepLen(); }
  }

  function applyScene() {
    if (!ac) return;
    const t = ac.currentTime;
    let cut = scene === 'playing' ? min(12000, 2200 + heat * 1500) : scene === 'dying' ? 240 : scene === 'paused' ? 450 : 1050;
    if (rushOn) cut = min(16000, cut + 5200);     // overdrive sweeps the whole track open
    lp.frequency.cancelScheduledValues(t); lp.frequency.setTargetAtTime(cut, t, scene === 'dying' ? 0.1 : 0.35);
    const lvl = !musicOn ? 0 : scene === 'dying' ? 0.22 : scene === 'paused' ? 0.3 : 0.5;
    mus.gain.cancelScheduledValues(t); mus.gain.setTargetAtTime(lvl, t, musicOn ? 0.2 : 0.05);
  }

  const live = () => ac && !muted && sfxOn && ac.state === 'running';
  return {
    unlock() { if (!AC) return; try { if (!ac) init(); if (ac.state !== 'running' && !document.hidden) ac.resume(); } catch (e) {} },
    sleep(off) { if (!ac) return; try { if (off) ac.suspend(); else ac.resume(); } catch (e) {} },
    scene(s) { scene = s; applyScene(); },
    heat(h) { if (h !== heat) { heat = h; bpm = BPM0 + min(max(h - 1, 0), 12) * 3; applyScene(); } },
    muted: () => muted,
    sfxOn: () => sfxOn,
    musicOn: () => musicOn,
    toggleSfx() { sfxOn = !sfxOn; store.set('sfx', sfxOn ? '1' : '0'); if (ac) sfx.gain.setTargetAtTime(sfxOn ? 0.9 : 0, ac.currentTime, 0.03); return sfxOn; },
    toggleMusic() { musicOn = !musicOn; store.set('music', musicOn ? '1' : '0'); applyScene(); return musicOn; },
    toggle() { muted = !muted; store.set('muted', muted ? '1' : '0'); if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.85, ac.currentTime, 0.03); return muted; },
    // 0..1 envelope that spikes on every beat of the track (or of a silent clock)
    pulse(rt) {
      const B = 60 / bpm, ph = ac && ac.state === 'running' && beatAt ? ((((ac.currentTime - beatAt) / B) % 1) + 1) % 1 : (rt / B) % 1;
      return exp(-ph * 5.5);
    },
    // the scheduler's position: reads as {state, steps, key, bpm}; pass steps to jump the arrangement (tests use it to reach rare bars)
    clock(steps) {
      if (steps !== undefined) stepI = steps;
      return { state: ac ? ac.state : 'off', steps: stepI, key: keyT, bpm };
    },
    eat(combo, pan = 0) { if (!live()) return; const t = ac.currentTime, n = SCALE[min(combo, SCALE.length) - 1] + keyT; voice('triangle', hz(n), t, 0.2, 0.2, sfx, { echo: 1, pan }); voice('sine', hz(n + 12), t + 0.045, 0.16, 0.1, sfx, { pan }); hiss(t, 0.03, 0.05, 'highpass', 5000, sfx); },
    bonus(pan = 0) { if (!live()) return; const t = ac.currentTime; [69, 72, 76, 81, 84, 88].forEach((n, i) => voice('triangle', hz(n + keyT), t + i * 0.05, 0.3, 0.14, sfx, { echo: 1, pan: pan + (i % 2 ? 0.25 : -0.25) })); hiss(t, 0.35, 0.05, 'highpass', 6000, sfx); },
    bonusSpawn() { if (!live()) return; const t = ac.currentTime; voice('sine', hz(88 + keyT), t, 0.25, 0.06, sfx, { echo: 1 }); voice('sine', hz(93 + keyT), t + 0.09, 0.3, 0.05, sfx, { echo: 1 }); },
    turn() { if (!live()) return; voice('sine', 820, ac.currentTime, 0.035, 0.03, sfx, { to: 620 }); },
    die() { if (!live()) return; const t = ac.currentTime; voice('sawtooth', 196, t, 0.9, 0.2, sfx, { to: 36, cut: 1800, cutTo: 120 }); voice('sine', 130, t, 0.6, 0.5, sfx, { to: 30 }); hiss(t, 0.7, 0.3, 'lowpass', 2400, sfx, 90); },
    start() { if (!live()) return; const t = ac.currentTime; hiss(t, 0.4, 0.09, 'bandpass', 400, sfx, 6000, 1.5); [57, 64, 69, 76].forEach((n, i) => voice('triangle', hz(n + keyT), t + i * 0.055, 0.28, 0.12, sfx, { echo: 1 })); },
    comboLost() { if (!live()) return; voice('triangle', 392, ac.currentTime, 0.22, 0.06, sfx, { to: 233 }); },
    blip(up) { if (!live()) return; voice('sine', up ? 520 : 660, ac.currentTime, 0.09, 0.08, sfx, { to: up ? 780 : 440 }); },
    best() { if (!live()) return; const t = ac.currentTime + 0.4; [76, 81, 84, 88, 93].forEach((n, i) => voice('triangle', hz(n + keyT), t + i * 0.09, 0.45, 0.13, sfx, { echo: 1 })); },
    golden(combo, pan = 0) {
      if (!live()) return; const t = ac.currentTime, n = SCALE[min(combo, SCALE.length) - 1] + keyT;
      voice('square', hz(n + 12), t, 0.12, 0.05, sfx, { to: hz(n + 24), cut: 5200, pan });
      voice('triangle', hz(n + 19), t + 0.07, 0.3, 0.13, sfx, { echo: 1, pan }); hiss(t, 0.18, 0.06, 'highpass', 7000, sfx);
    },
    // a riser into a sub drop, with the fanfare over the top
    milestone() {
      if (!live()) return; const t = ac.currentTime + 0.08;
      hiss(t - 0.08, 0.5, 0.07, 'bandpass', 300, sfx, 9000, 2); voice('sine', 62, t + 0.42, 0.7, 0.55, sfx, { to: 31, attack: 0.004 });
      [81, 85, 88, 93].forEach((n, i) => voice('square', hz(n + keyT), t + i * 0.08, 0.17, 0.05, sfx, { cut: 3800, echo: 1, pan: (i - 1.5) * 0.4 }));
    },
    // overdrive: a whoosh on ignition and a rushing-air bed while it lasts
    boost(on) {
      rushOn = on;
      if (!ac) return;
      if (!rush) {
        const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
        src.buffer = noise; src.loop = true; fl.type = 'bandpass'; fl.Q.value = 0.8; fl.frequency.value = 700; g.gain.value = 0;
        src.connect(fl); fl.connect(g); g.connect(sfx); src.start(); rush = { fl, g };
      }
      const t = ac.currentTime;
      rush.g.gain.setTargetAtTime(on ? 0.06 : 0, t, on ? 0.05 : 0.12); rush.fl.frequency.setTargetAtTime(on ? 2600 : 700, t, 0.3);
      if (on && live()) { hiss(t, 0.4, 0.12, 'bandpass', 420, sfx, 5200, 1.2); voice('sawtooth', 98, t, 0.32, 0.05, sfx, { to: 392, cut: 1600 }); }
      applyScene();
    },
  };
})();

// ── gpu: the snake is lit in gl, then bloom, god rays, grading ───────────
// The 2D canvas renders the world; WebGL lights the snake on top of it and grades the frame.
// Half-float targets where the hardware has them (webgl2) so speculars and bloom stop banding.
// Without WebGL — or if the snake program will not build — the 2D capsule tube carries on alone.
const fx = (() => {
  const cv = document.createElement('canvas'), api = { ok: false, snakeOk: false, cv };
  let gl = null, hdr = false;
  try { gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' }); } catch (e) {}
  if (gl) hdr = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
  if (!gl) { try { gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' }); } catch (e) {} }
  if (!gl) return api;
  const IF = hdr ? gl.RGBA16F : gl.RGBA, TY = hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  const VS = 'attribute vec2 p; varying vec2 v; void main() { v = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';

// ── layout ──────────────────────────────────────────────────────────────
function metrics() {

// grid dimensions that suit the current viewport; fixed for the length of a run
function gridFor() {
  const aw = W - margin * 2, ah = H - hudH - margin * 2 - deckH;

  let cols = floor(aw / cs + 0.05), rows = floor(ah / cs + 0.05);

function layout() {

function fitBoard() {

  bw = g.cols * cell; bh = g.rows * cell;

  }

// ── effects ─────────────────────────────────────────────────────────────
const parts = [], rings = [], ripples = [], popups = [], dust = [], streaks = [], afterglow = [];

function spark(x, y, vx, vy, life, size, h, l, kind = 0, grav = 0) {

}

function updateFx(dt) {

    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    if (p.grav) { p.vx *= flutter; p.vy = p.vy * flutter + p.grav * dt; } else { p.vx *= drag; p.vy *= drag; }

  }

    const k = streaks[i];
    if ((k.life -= dt) <= 0) { streaks.splice(i, 1); continue; }
    k.x += k.vx * dt; k.y += k.vy * dt;
  }
  for (let i = afterglow.length - 1; i >= 0; i--) if ((afterglow[i].life -= dt) <= 0) afterglow.splice(i, 1);
  for (let i = waves.length - 1; i >= 0; i--) { const w = waves[i]; w.r += w.speed * dt; if ((w.life -= dt) <= 0) waves.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) if ((rings[i].life -= dt) <= 0) rings.splice(i, 1);
  for (let i = popups.length - 1; i >= 0; i--) if ((popups[i].life -= dt) <= 0) popups.splice(i, 1);
  for (let i = ripples.length - 1; i >= 0; i--) {

}

// ── game ────────────────────────────────────────────────────────────────
function newGame(demo) {

    demo, cols, rows,
    snake: [], dir: { x: 1, y: 0 }, queue: [], grow: 0, prevTail: null, pending: null,
    acc: 0, delay: demo ? 0.15 : 0.5, speed: 8, stepTime: 0.125,
    food: null, bonus: null, bonusIn: irnd(4, 6), spawned: 0,
    eaten: 0, novas: 0, score: 0, combo: 1, comboT: 0, comboWin: 4, comboMax: 1,
    energy: 100, boosting: false, st: 0.125,
    alive: true, perfect: false, done: false, dieT: 0, dieDur: 0, dieEnd: Infinity, dissolve: 0,
    bulges: [], time: 0, hunger: 0, angle: 0, blink: rnd(1.5, 4), tongue: rnd(1, 3), ember: 0,

  tune(g); g.st = g.stepTime; g.food = nextFood(g);

}

function tune(g) {
  const k = g.demo ? 1 : PACES[opts.pace].k;
  const base = (g.demo ? 9.5 : coarse ? 6.4 : 7.6) * k, cap = (g.demo ? 13 : coarse ? 11 : 14.5) * k;
  g.speed = min(cap, base + g.eaten * 0.11 * k); g.stepTime = 1 / g.speed;

// seconds a clean run from the head to `it` takes, padded by `slack`
function reach(g, it, slack, extra) {
  const h = g.snake[0];
  let dx = abs(it.x - h.x), dy = abs(it.y - h.y);
  if (opts.portal) { dx = min(dx, g.cols - dx); dy = min(dy, g.rows - dy); }
  return (dx + dy) / g.speed * slack + extra;
}

// every fifth orb comes out golden and pays five times over
function nextFood(g) { const f = spawn(g); if (f) f.golden = ++g.spawned % 5 === 0; return f; }

// fold an unwrapped path coordinate back onto the board (portal walls)
const wrapC = (v, n) => ((((v + 0.5) % n) + n) % n) - 0.5;

// a random free cell, preferably not right under the snake's nose
function spawn(g) {
  const { cols, rows, snake } = g, N = cols * rows, occ = new Uint8Array(N);
  for (const s of snake) occ[s.y * cols + s.x] = 1;
  if (g.food) occ[g.food.y * cols + g.food.x] = 1;
  if (g.bonus) occ[g.bonus.y * cols + g.bonus.x] = 1;
  let free = 0;
  for (let i = 0; i < N; i++) if (!occ[i]) free++;

  for (let tries = 0; tries < 12; tries++) {
    let k = floor(Math.random() * free), i = 0;
    for (; i < N; i++) if (!occ[i] && k-- === 0) break;

}

function step(g) {

  if (g.demo) { const d = aiChoose(g); if (d) g.dir = d; }
  else if (g.queue.length) g.dir = g.queue.shift();
  const h = g.snake[0], pop = g.grow === 0;
  let nx = h.x + g.dir.x, ny = h.y + g.dir.y;
  if (opts.portal) { nx = (nx + g.cols) % g.cols; ny = (ny + g.rows) % g.rows; }   // out one side, in the other
  let hit = nx < 0 || ny < 0 || nx >= g.cols || ny >= g.rows;

  for (let i = 1, n = g.snake.length - (pop ? 1 : 0); i < n && !hit; i++) hit = g.snake[i].x === nx && g.snake[i].y === ny;
  if (hit) { die(g, false); return false; }

  else { g.grow--; g.prevTail = null; }

function resolveEat(g) {

  const x = cellX(it.x), y = cellY(it.y), h = bonus ? novaHue(g) : gold ? GOLD : foodHue();
  const cmb = g.combo;   // combo carried over from the last eat, used to scale this one's dressing

  ring(x, y, h, cell * (big ? 3.6 : 2.1 + min(cmb, 12) * 0.15), big ? 0.7 : 0.5, big ? 4 : 2.6);
  ripple(x, y, big ? 1 : 0.6, big ? 16 : 13, big ? 1.2 : 0.8);

  if (big) stars(x, y, h, bonus ? 16 : 9);

    g.comboT = g.comboWin = clamp(reach(g, g.food || it, 1.6, 1.2), 2.4, 8);   // time to make the next one count
    const mult = g.boosting ? 2 : 1, pts = (bonus ? 100 : gold ? 50 : 10) * g.combo * mult;
    g.score += pts; g.energy = bonus ? 100 : min(100, g.energy + 20);
    const sub = bonus ? 'NOVA!' : gold ? 'GOLD ×5' : [g.combo > 1 ? '×' + g.combo : '', mult > 1 ? 'OVERDRIVE ×2' : ''].filter(Boolean).join(' · ');
    popup(x, y - cell * 0.5, '+' + pts, h, cell * (big ? 0.95 : 0.6 + min(g.combo, 6) * 0.045), sub);
    shake = max(shake, big ? 8 : 2.2 + min(g.combo, 12) * 0.55); punch = max(punch, big ? 0.05 : 0.011 + min(g.combo, 10) * 0.0015);
    if (big || cmb >= 7) { imp = big ? 1 : 0.7; impX = x; impY = y; }   // spokes of light, punched into the gpu pass
    freeze = max(freeze, big ? 0.09 : 0.06);   // hitstop
    const pan = clamp((x - W / 2) / (W / 2), -1, 1) * 0.7;
    if (bonus) { glitch = max(glitch, 0.45); flash = 0.22; flashRGB = '255,230,170'; audio.bonus(pan); }
    else if (gold) { glitch = max(glitch, 0.3); flash = 0.16; flashRGB = '255,214,120'; audio.golden(g.combo, pan); }

function die(g, perfect) {

    burst(x, y, 350, g.demo ? 14 : 34, 1.3, 70);

const MILESTONES = { 5: 'ON FIRE!', 10: 'UNSTOPPABLE!', 15: 'GODLIKE!', 20: 'LEGENDARY!' };

function updateGame(g, gdt, dt) {

  if (!g.demo) {
    const was = g.boosting;

    if (g.boosting) { g.energy = max(0, g.energy - 51 * gdt); if (g.energy <= 0) g.boosting = false; }

  if (g.delay > 0) g.delay -= gdt;

      if (g.pending) resolveEat(g);
      if (!g.alive) return;
      g.acc -= g.st;
      if (!step(g)) return;

    }
  }

  if ((g.ember -= gdt) <= 0 && PN > 1) {

    const i = PN - 1;
    const hx = bx + (wrapC(PX[0], g.cols) + 0.5) * cell, hy = by + (wrapC(PY[0], g.rows) + 0.5) * cell;
    spark(bx + (wrapC(PX[i], g.cols) + 0.5) * cell, by + (wrapC(PY[i], g.rows) + 0.5) * cell, rnd(-0.6, 0.6) * cell, rnd(-0.6, 0.6) * cell, rnd(0.3, 0.7), 1.5 * cell / 36, bodyHue(PLEN), 62);
    if (Math.random() < 0.3) spark(hx + rnd(-0.3, 0.3) * cell, hy + rnd(-0.3, 0.3) * cell, rnd(-0.4, 0.4) * cell, rnd(-0.4, 0.4) * cell, rnd(0.25, 0.5), 1.2 * cell / 36, bodyHue(0) + rnd(-30, 30), 76);

// ── autopilot for the attract mode ──────────────────────────────────────
const AI = { n: 0, free: null, dist: null, prev: null, q: null, mark: null };

      const nc = ny * cols + nx;

// ── snake geometry: a smooth centre line sampled by arc length ──────────

const runs = [];   // [shiftX, shiftY, firstSample, lastSample] per run, in cells

function bodyHue(s) {
  const th = opts.theme;
  if (th.body) return paletteHue(th.body, s / max(4, PLEN));
  if (th.id === 'rainbow') return realTime * 120 - s * 32;             // colours chase down the body

function foodHue() { const th = opts.theme; return th.body ? th.food : hue + FOOD_SHIFT; }
function novaHue(g) { const th = opts.theme; return th.body ? th.nova : g.time * 160; }

// ── drawing ─────────────────────────────────────────────────────────────

function drawDust(c, t) {

// grid dots light up around the head and the food, and ride every shockwave
