  const hx = bx + (wrapC(PX[0], g.cols) + 0.5) * cell, hy = by + (wrapC(PY[0], g.rows) + 0.5) * cell, live = g.alive;
  const sp2 = 2 * (cell * 2.3) ** 2, r0 = max(0.8, cell * 0.034), pulse = beat * (mode === 'playing' ? 0.09 : 0.05) + fever * 0.05 * beat;
  const f = g.food, fx = f ? cellX(f.x) : 0, fy = f ? cellY(f.y) : 0, fp = 0.22 + 0.1 * sin(g.time * 5);
  c.fillStyle = hsla(hue + 24, 95, 80, 1);
  for (let j = 0; j < g.rows; j++) for (let i = 0; i < g.cols; i++) {
    const x = bx + (i + 0.5) * cell, y = by + (j + 0.5) * cell;
    let I = pulse, ox = 0, oy = 0;   // the whole grid breathes with the kick
    if (live) { const dx = x - hx, dy = y - hy; I += 0.5 * exp(-(dx * dx + dy * dy) / sp2); }
    if (f) { const dx = x - fx, dy = y - fy; I += fp * exp(-(dx * dx + dy * dy) / (sp2 * 0.3)); }
    for (let k = 0; k < ripples.length; k++) {
      const r = ripples[k], dx = x - r.x, dy = y - r.y, d = sqrt(dx * dx + dy * dy) + 0.01, q = (d - r.r) / r.w;
      if (q > -2.5 && q < 2.5) { const a = r.a * exp(-q * q); I += a; ox += dx / d * a * cell * 0.24; oy += dy / d * a * cell * 0.24; }
    }
    if (I < 0.035) continue;
    if (I > 1) I = 1;
    c.globalAlpha = gp ? I * 0.55 : I;
    c.beginPath(); c.arc(x + ox, y + oy, r0 + I * cell * 0.06, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
}

function light(c, x, y, r, h, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hsla(h, 100, 60, a)); g.addColorStop(0.5, hsla(h, 100, 55, a * 0.3)); g.addColorStop(1, hsla(h, 100, 50, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}

// soft pools of light on the board under the head, the food and the bonus
function drawLights(c, g) {
  c.save();
  rr(c, bx - cell * PAD, by - cell * PAD, bw + cell * PAD * 2, bh + cell * PAD * 2, cell * 0.5); c.clip();
  c.globalCompositeOperation = 'lighter';
  if (g.alive) light(c, bx + (wrapC(PX[0], g.cols) + 0.5) * cell, by + (wrapC(PY[0], g.rows) + 0.5) * cell, cell * (4.6 + 1.2 * fever * beat), bodyHue(0) + 10, 0.2 + 0.12 * boostFx + 0.15 * fever * beat);
  if (g.food) light(c, cellX(g.food.x), cellY(g.food.y), cell * (2.7 + 0.25 * beat + 0.5 * fever * beat), g.food.golden ? GOLD : foodHue(), g.food.golden ? 0.28 : 0.2);
  if (g.bonus) light(c, cellX(g.bonus.x), cellY(g.bonus.y), cell * 3.2, novaHue(g), 0.22);
  for (const a of afterglow) light(c, cellX(a.x), cellY(a.y), cell * 0.95, a.h, 0.15 * (a.life / 0.5));   // the board keeps a glow where the tail just was
  c.restore();
}

function drawFrame(c, gp) {
  const p = cell * PAD, h = turnTo(turnTo(hue, 330, boostFx * 0.85, 360), 350, hurt, 360), a = min(1, 0.5 + 0.28 * beat + 0.4 * hurt + 0.35 * boostFx + 0.3 * fever * beat);
  rr(c, bx - p, by - p, bw + p * 2, bh + p * 2, cell * 0.5);
  c.strokeStyle = hsla(h, 100, gp ? 58 : 74, gp ? a * 0.8 : a); c.lineWidth = (gp ? 4 : 1.5) + boostFx;
  if (opts.portal) { c.setLineDash([cell * 0.55, cell * 0.3]); c.lineDashOffset = -realTime * cell * 1.4; }   // portal walls: open, marching
  c.stroke();
  // two pulses of current chase round the border, quicker as the run heats up
  const fw = bw + p * 2, fh = bh + p * 2, rad = min(cell * 0.5, fw / 2, fh / 2), per = 2 * (fw + fh) - (8 - TAU) * rad, len = per * 0.07;
  const run = P && (mode === 'playing' || mode === 'paused') ? min(P.combo, 10) : 1;
  c.setLineDash([len, per / 2 - len]); c.lineDashOffset = -realTime * per * (0.06 + 0.025 * run + boostFx * 0.18);
  rr(c, bx - p, by - p, fw, fh, cell * 0.5);
  c.strokeStyle = hsla(h + 25, 100, gp ? 72 : 90, 1); c.lineWidth = gp ? 6 : 2.4; c.stroke();
  c.setLineDash([]);
}

// a slow sheen slides across the glass every few seconds
function drawSheen(c) {
  const ph = (realTime % 8) / 8;
  if (ph > 0.5) return;
  const k = ph / 0.5, x = bx - bw * 0.3 + bw * 1.6 * outCubic(k), a = 0.05 * sin(k * PI);
  c.save(); rr(c, bx - cell * PAD, by - cell * PAD, bw + cell * PAD * 2, bh + cell * PAD * 2, cell * 0.5); c.clip();
  const gr = c.createLinearGradient(x - cell * 5, by, x + cell * 5, by + bh * 0.35);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, `rgba(255,255,255,${a.toFixed(3)})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gr; c.fillRect(bx - cell, by - cell, bw + cell * 2, bh + cell * 2);
  c.restore();
}

function drawFood(c, g, gp) {
  const f = g.food;
  if (!f) return;
  const gold = f.golden, x = cellX(f.x), y = cellY(f.y), h = gold ? GOLD : foodHue();
  const r = cell * (gold ? 0.33 : 0.3) * outBack(clamp((g.time - f.born) / 0.35, 0, 1)) * (1 + 0.07 * sin(g.time * (gold ? 9 : 5.2)) + 0.1 * beat + 0.12 * fever * beat);
  if (r <= 0.01) return;
  if (gp) { c.fillStyle = hsla(h, 100, 60, 1); c.beginPath(); c.arc(x, y, r * (gold ? 1.5 : 1.15), 0, TAU); c.fill(); return; }
  if (gold) {   // golden: an angry pulsing ring and three sparks in orbit
    const q = 0.5 + 0.5 * sin(g.time * 9);
    c.strokeStyle = hsla(GOLD, 100, 70, 0.5 + 0.45 * q); c.lineWidth = max(1.5, cell * 0.06);
    c.beginPath(); c.arc(x, y, r * (1.95 + 0.18 * q), 0, TAU); c.stroke();
    c.fillStyle = hsla(GOLD + 12, 100, 82, 1);
    for (let i = 0; i < 3; i++) { const b = -g.time * 3.2 + i * TAU / 3; c.beginPath(); c.arc(x + cos(b) * r * 2.5, y + sin(b) * r * 2.5, max(1, cell * 0.045), 0, TAU); c.fill(); }
  }
  const halo = c.createRadialGradient(x, y, 0, x, y, cell * 0.95);
  halo.addColorStop(0, hsla(h, 100, 60, 0.34)); halo.addColorStop(1, hsla(h, 100, 60, 0));
  c.fillStyle = halo; c.beginPath(); c.arc(x, y, cell * 0.95, 0, TAU); c.fill();
  const core = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.05, x, y, r);
  core.addColorStop(0, '#fff'); core.addColorStop(0.35, hsla(h, 100, 72, 1)); core.addColorStop(1, hsla(h - 14, 100, 50, 1));
  c.fillStyle = core; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  const a = g.time * 2.4;
  c.strokeStyle = hsla(h, 100, 76, 0.8); c.lineWidth = max(1, cell * 0.035); c.lineCap = 'round';
  c.beginPath(); c.arc(x, y, r * 1.6, a, a + 1.5); c.stroke();
  c.beginPath(); c.arc(x, y, r * 1.6, a + PI, a + PI + 1.5); c.stroke();
}

function starPath(c, x, y, R, r, rot) {
  c.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * PI / 4, q = i % 2 ? r : R; c.lineTo(x + cos(a) * q, y + sin(a) * q); }
  c.closePath();
}

function drawBonus(c, g, gp) {
  const b = g.bonus;
  if (!b) return;
  const x = cellX(b.x), y = cellY(b.y), h = novaHue(g);
  const R = cell * 0.46 * outBack(clamp((b.ttl - b.life) / 0.4, 0, 1)) * (1 + 0.08 * sin(g.time * 7)), rot = g.time * 1.6;
  if (R <= 0.01) return;
  c.globalAlpha = b.life < 1.6 ? 0.4 + 0.6 * abs(sin(b.life * 13)) : 1;   // flicker before it expires
  if (gp) { c.fillStyle = hsla(h, 100, 64, 1); starPath(c, x, y, R, R * 0.42, rot); c.fill(); c.globalAlpha = 1; return; }
  const fill = c.createRadialGradient(x, y, 0, x, y, R);
  fill.addColorStop(0, '#fff'); fill.addColorStop(0.4, hsla(h, 100, 82, 1)); fill.addColorStop(1, hsla(h + 40, 100, 62, 1));
  c.fillStyle = fill; starPath(c, x, y, R, R * 0.38, rot); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.92)'; starPath(c, x, y, R * 0.52, R * 0.15, -rot * 1.4 + 0.6); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = max(1.2, cell * 0.05); c.lineCap = 'round';
  c.beginPath(); c.arc(x, y, cell * 0.58, -PI / 2, -PI / 2 + TAU * clamp(b.life / b.ttl, 0.001, 1)); c.stroke();
  c.globalAlpha = 1;
}

function tracePath(c, i0, i1, ox, oy) {
  c.beginPath(); c.moveTo(bx + (PX[i0] + 0.5) * cell + ox, by + (PY[i0] + 0.5) * cell + oy);
  for (let i = i0 + 1; i <= i1; i++) c.lineTo(bx + (PX[i] + 0.5) * cell + ox, by + (PY[i] + 0.5) * cell + oy);
}

// the tube is built from short capsules, tail to head, each with its own colour and girth
function capsules(c, i0, last, hop, k, lift) {
  for (let j = last; j > i0;) {
    const i = max(i0, j - hop);
    c.strokeStyle = hsla(PH[i], 100, clamp(PL[i] + lift, 0, 100), 1); c.lineWidth = 2 * PR[i] * cell * k;
    c.beginPath(); c.moveTo(bx + (PX[i] + 0.5) * cell, by + (PY[i] + 0.5) * cell); c.lineTo(bx + (PX[j] + 0.5) * cell, by + (PY[j] + 0.5) * cell); c.stroke();
    j = i;
  }
}

function drawSnake(c, g, gp) {
  if (PN < 2) return;
  const gpu = fx.ok && fx.snakeOk;   // the gl tube draws itself; 2d keeps only what sits on top of it
  let cut = 0;   // the dead snake burns away from the head
  if (!g.alive) { while (cut < PN - 1 && PS[cut] < g.dissolve) cut++; if (cut >= PN - 1) return; }
  for (let k = 0; k < runs.length; k += 4) {
    const i0 = max(runs[k + 2], cut), last = runs[k + 3];
    if (last <= i0 || (gpu && (gp || i0 > 0))) continue;
    c.save();
    if (opts.portal) { c.beginPath(); c.rect(bx, by, bw, bh); c.clip(); }
    c.translate(runs[k] * cell, runs[k + 1] * cell);
    if (gpu) { if (g.alive) drawTongue(c, g); if (g.dissolve < 0.3) drawEyes(c, g); }
    else drawSnakeRun(c, g, gp, i0, last);
    c.restore();
  }
}

function drawSnakeRun(c, g, gp, i0, last) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (gp) { capsules(c, i0, last, 2, 0.92, 4); return; }
  const head = i0 === 0;
  c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = cell * 0.74;
  tracePath(c, i0, last, 0, cell * 0.14); c.stroke();
  if (g.alive && head) drawTongue(c, g);
  capsules(c, i0, last, 1, 1, -15);        // dark rim
  capsules(c, i0, last, 1, 0.78, 0);       // body
  capsules(c, i0, last, 1, 0.38, 8);       // lit core
  if (cell >= 14) {   // scales: faint chevrons down the back, pointing toward the tail
    const step = max(1, round(0.42 / (PS[1] - PS[0] || 0.2)));
    c.lineWidth = max(1, cell * 0.035); c.strokeStyle = 'rgba(255,255,255,0.16)'; c.beginPath();
    for (let i = i0 + 2 + ((i0 + 2) % step ? step - (i0 + 2) % step : 0); i < last - 1 && PS[i] < PLEN - 1.6; i += step) {
      const tx = PX[i + 1] - PX[i - 1], ty = PY[i + 1] - PY[i - 1], L = hypot(tx, ty) || 1, ux = tx / L, uy = ty / L, r = PR[i] * cell * 0.5;
      const x = bx + (PX[i] + 0.5) * cell, y = by + (PY[i] + 0.5) * cell;
      c.moveTo(x - uy * r - ux * r * 0.5, y + ux * r - uy * r * 0.5); c.lineTo(x, y); c.lineTo(x + uy * r - ux * r * 0.5, y - ux * r - uy * r * 0.5);
    }
    c.stroke();
  }
  let i1 = last;                            // specular streak, stopping short of the tail taper
  while (i1 > i0 && PS[i1] > PLEN - 2.2) i1--;
  if (i1 > i0) { c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = max(1, cell * 0.055); tracePath(c, i0, i1, -cell * 0.09, -cell * 0.11); c.stroke(); }
  if (head && g.dissolve < 0.3) drawEyes(c, g);
}

function drawTongue(c, g) {
  if (g.tongue > 0) return;
  const k = sin(clamp(-g.tongue / 0.42, 0, 1) * PI), a = g.angle + sin(g.time * 40) * 0.14 * k;
  const hx = bx + (PX[0] + 0.5) * cell, hy = by + (PY[0] + 0.5) * cell;
  const x0 = hx + cos(g.angle) * cell * 0.3, y0 = hy + sin(g.angle) * cell * 0.3;
  const L = cell * (0.12 + 0.5 * k), x1 = x0 + cos(a) * L, y1 = y0 + sin(a) * L, fork = cell * 0.17 * k;
  c.strokeStyle = '#ff4f8b'; c.lineWidth = max(1, cell * 0.055);
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.lineTo(x1 + cos(a + 0.55) * fork, y1 + sin(a + 0.55) * fork);
  c.moveTo(x1, y1); c.lineTo(x1 + cos(a - 0.55) * fork, y1 + sin(a - 0.55) * fork); c.stroke();
}

function drawEyes(c, g) {
  const hx = bx + (PX[0] + 0.5) * cell, hy = by + (PY[0] + 0.5) * cell, a = g.angle, fx = cos(a), fy = sin(a), R = cell;
  const shock = g.alive ? 0 : 1, open = g.alive && g.blink < 0 ? 0.12 : 1, t = g.bonus || g.food;
  const near = t && g.alive ? smooth(5, 1.2, hypot(t.x - g.snake[0].x, t.y - g.snake[0].y)) : 0;   // pupils widen near food
  let tx = fx, ty = fy;
  if (t) { const dx = cellX(t.x) - hx, dy = cellY(t.y) - hy, d = hypot(dx, dy) || 1; tx = dx / d; ty = dy / d; }   // watch the food
  for (let s = -1; s <= 1; s += 2) {
    const ex = hx + fx * R * 0.1 - fy * R * 0.21 * s, ey = hy + fy * R * 0.1 + fx * R * 0.21 * s, er = R * (shock ? 0.17 : 0.145);
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, ey, er * open, er, a, 0, TAU); c.fill();
    if (open < 1) continue;
    const px = ex + tx * R * 0.05 * (1 - shock), py = ey + ty * R * 0.05 * (1 - shock);
    if (!shock) { c.fillStyle = hsla(foodHue(), 100, 58, 1); c.beginPath(); c.arc(px, py, R * 0.098, 0, TAU); c.fill(); }
    c.fillStyle = '#080a18'; c.beginPath(); c.arc(px, py, R * (shock ? 0.05 : 0.07 + 0.035 * near), 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.95)'; c.beginPath(); c.arc(px - R * 0.026, py - R * 0.03, R * 0.024, 0, TAU); c.fill();
  }
}

function drawRings(c) {
  for (const r of rings) {
    const t = 1 - r.life / r.ttl;
    c.strokeStyle = hsla(r.h, 100, 68, (1 - t) ** 1.5); c.lineWidth = r.w * (1 - t) + 0.5;
    c.beginPath(); c.arc(r.x, r.y, cell * 0.2 + (r.r1 - cell * 0.2) * outCubic(t), 0, TAU); c.stroke();
  }
}

function drawParts(c) {
  c.lineCap = 'round';
  for (const p of parts) {
    const a = p.life / p.ttl;
    if (p.kind === 2) { c.fillStyle = hsla(p.h, 100, p.l, a); starPath(c, p.x, p.y, p.size * (0.5 + 0.5 * a), p.size * 0.38 * (0.5 + 0.5 * a), p.rot); c.fill(); continue; }
    if (p.kind === 3) {   // a shard of the glass tube, tumbling as it falls
      const r = p.size, q = p.rot;
      c.beginPath(); c.moveTo(p.x + cos(q) * r, p.y + sin(q) * r); c.lineTo(p.x + cos(q + 2.3) * r * 0.55, p.y + sin(q + 2.3) * r * 0.55); c.lineTo(p.x + cos(q + 4.2) * r * 0.8, p.y + sin(q + 4.2) * r * 0.8); c.closePath();
      c.fillStyle = hsla(p.h, 95, p.l, a * 0.75); c.fill();
      c.strokeStyle = `rgba(255,255,255,${(a * 0.8).toFixed(3)})`; c.lineWidth = max(0.8, cell * 0.025); c.stroke(); continue;
    }
    if (p.kind === 1) {   // confetti: a short ribbon tumbling end over end
      const L = p.size * 1.7, dx = cos(p.rot) * L, dy = sin(p.rot * 0.7) * L * 0.6;
      c.strokeStyle = hsla(p.h, 90, p.l, min(1, a * 2)); c.lineWidth = p.size;
      c.beginPath(); c.moveTo(p.x - dx, p.y - dy); c.lineTo(p.x + dx, p.y + dy); c.stroke(); continue;
    }
    c.strokeStyle = hsla(p.h, 100, p.l, a); c.lineWidth = p.size * (0.4 + 0.6 * a);
    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03 + 0.01, p.y - p.vy * 0.03); c.stroke();
  }
}

function drawPopups(c, gp) {
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const p of popups) {
    const t = 1 - p.life / p.ttl, a = t < 0.1 ? t / 0.1 : 1 - smooth(0.55, 1, t);
    c.font = `800 ${(p.size * (0.7 + 0.3 * outBack(min(1, t / 0.22)))).toFixed(1)}px ${FONT}`;
    c.fillStyle = hsla(p.h, 100, gp ? 60 : 88, gp ? a * 0.4 : a);
    const y = p.y - cell * 1.1 * outCubic(t);
    c.fillText(p.text, p.x, y);
    if (p.sub) { c.font = `800 ${(p.size * 0.42).toFixed(1)}px ${FONT}`; c.fillText(p.sub, p.x, y + p.size * 0.74); }
  }
}

function drawStreaks(c) {
  c.save(); c.beginPath(); c.rect(bx, by, bw, bh); c.clip();
  c.lineCap = 'round'; c.lineWidth = max(1, cell * 0.045);
  for (const k of streaks) {
    const v = hypot(k.vx, k.vy) || 1;
    c.strokeStyle = hsla(foodHue(), 100, 82, 0.34 * k.life / k.ttl);
    c.beginPath(); c.moveTo(k.x, k.y); c.lineTo(k.x - k.vx / v * k.len, k.y - k.vy / v * k.len); c.stroke();
  }
  c.restore();
}

function drawScene(c, g, gp) {
  drawFood(c, g, gp); drawBonus(c, g, gp); drawSnake(c, g, gp);
  c.globalCompositeOperation = 'lighter';
  drawRings(c); drawParts(c); if (streaks.length) drawStreaks(c);
  c.globalCompositeOperation = 'source-over';
  drawPopups(c, gp);
}

// bloom: everything emissive is redrawn small and blurred down a mip chain; render() lays it
// under the crisp scene as a halo and adds a little back on top for heat
function bloom() {
  for (let i = 1; i < glow.length; i++) {
    const b = glow[i].x;
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = 'copy';
    b.drawImage(glow[i - 1].c, 0, 0, glow[i].w, glow[i].h);
  }
  for (let i = glow.length - 2; i >= 0; i--) {
    const b = glow[i].x;
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = 'lighter';
    b.drawImage(glow[i + 1].c, 0, 0, glow[i].w, glow[i].h);
  }
}

function addGlow(a) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (; a > 0.01; a -= 1) { ctx.globalAlpha = min(1, a); ctx.drawImage(glow[0].c, 0, 0, canvas.width, canvas.height); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// impact dressing: red/cyan ghosts, torn scanlines, a colour flash
function post() {
  const c = ctx, cw = canvas.width, ch = canvas.height;
  c.setTransform(1, 0, 0, 1, 0, 0);
  const gg = max(glitch, (fever - 0.4) * 1.1);   // at fever the rgb ghosts never fully leave
  if (gg > 0.02 && !calm) {
    if (!ghostR) { ghostR = mkCanvas(ceil(cw / 2), ceil(ch / 2)); ghostB = mkCanvas(ghostR.w, ghostR.h); }
    for (const [b, tint] of [[ghostR, '#ff003c'], [ghostB, '#00e5ff']]) {
      const x = b.x;
      x.globalCompositeOperation = 'copy'; x.fillStyle = '#000'; x.fillRect(0, 0, b.w, b.h);
      x.globalCompositeOperation = 'source-over'; x.drawImage(canvas, 0, 0, b.w, b.h);
      x.globalCompositeOperation = 'multiply'; x.fillStyle = tint; x.fillRect(0, 0, b.w, b.h);
      x.globalCompositeOperation = 'destination-in'; x.drawImage(canvas, 0, 0, b.w, b.h);
    }
    const d = gg * 14 * dpr;
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = min(1, gg * 1.3);
    c.drawImage(ghostR.c, -d, 0, cw, ch); c.drawImage(ghostB.c, d, 0, cw, ch);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    for (let i = (gg * 5) | 0; i > 0; i--) {
      const y = (Math.random() * ch) | 0, h = max(2, (rnd(0.01, 0.06) * ch) | 0);
      c.drawImage(canvas, 0, y, cw, h, rnd(-1, 1) * gg * 40 * dpr, y, cw, h);
    }
  }
  if (flash > 0.01) {
    c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(${flashRGB},${flash.toFixed(3)})`;
    c.fillRect(0, 0, cw, ch); c.globalCompositeOperation = 'source-over';
  }
  if (opts.crt && !calm) crtWarp();
}

// crt: rows are squeezed a little more toward the top and bottom, so the picture bows like a tube
function crtWarp() {
  const c = ctx, cw = canvas.width, ch = canvas.height;
  if (!crtBuf || crtBuf.w !== cw || crtBuf.h !== ch) crtBuf = mkCanvas(cw, ch);
  crtBuf.x.clearRect(0, 0, cw, ch); crtBuf.x.drawImage(canvas, 0, 0);
  c.clearRect(0, 0, cw, ch);
  const n = 48, hs = ch / n, wob = glitch * 0.02;
  for (let i = 0; i < n; i++) {
    const y = i * hs, v = (i + 0.5) / n * 2 - 1, w = cw * (1 - 0.035 * v * v + (Math.random() - 0.5) * wob);
    c.drawImage(crtBuf.c, 0, y, cw, hs + 1, (cw - w) / 2, y, w, hs + 1);
  }
}

function render() {
  const g = G, c = ctx, k = calm ? 0.25 : 1, t = realTime;
  shX = (sin(t * 71) + sin(t * 113 + 1.3)) * 0.5 * shake * k;
  shY = (sin(t * 89 + 2.1) + sin(t * 67 + 0.4)) * 0.5 * shake * k;

  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.clearRect(0, 0, W, H);
  drawDust(c, t);
  camera(c, dpr, dpr);
  c.drawImage(boardCv, bx - boardOff, by - boardOff, boardW, boardH);
  drawSheen(c); drawLights(c, g); drawDots(c, g, false); drawFrame(c, false);

  shade(g);
  const g0 = glow[0], gc = g0.x;
  gc.setTransform(1, 0, 0, 1, 0, 0); gc.globalAlpha = 1; gc.globalCompositeOperation = 'source-over';
  gc.clearRect(0, 0, g0.w, g0.h);
  camera(gc, g0.w / W, g0.h / H);
  drawDots(gc, g, true); drawFrame(gc, true); drawScene(gc, g, true);
  const heat = (P && mode === 'playing' ? min(P.combo - 1, 11) * 0.02 : 0) + beat * 0.03 + boostFx * 0.12 + fever * 0.1;
  if (fx.ok) {
    camera(c, dpr, dpr);
    drawScene(c, g, false);
    finish(g, heat);
    return;
  }
  bloom();
  addGlow(BLOOM + heat * 2);
  camera(c, dpr, dpr);
  drawScene(c, g, false);
  addGlow(HEAT + heat);
  post();
}

// the gpu pass: the lit tube, bloom under everything, god rays, flares, refraction, grading
function finish(g, heat) {
  const hx = bx + (wrapC(PX[0] || 0, g.cols) + 0.5) * cell, hy = by + (wrapC(PY[0] || 0, g.rows) + 0.5) * cell;
  const ws = [];
  for (let i = waves.length - 1; i >= 0 && ws.length < 4; i--) { const w = waves[i], k = w.life / w.ttl; ws.push([w.x / W, 1 - w.y / H, w.r / H, w.amp * k * k * (calm ? 0.3 : 1)]); }
  const f = flash > 0.01 ? flashRGB.split(',').map((n) => (n / 255) * flash) : [0, 0, 0];
  const th = opts.theme, pal = th.body;
  const z = 1 + punch + camZ;
  const lights = [], put = (x, y, w) => { if (lights.length < 3) lights.push([x / W, 1 - y / H, w, 0]); };
  if (g.bonus) put(cellX(g.bonus.x), cellY(g.bonus.y), 1.15);
  if (g.food) put(cellX(g.food.x), cellY(g.food.y), g.food.golden ? 1 : 0.7);
  put(hx, hy, 0.5);
  fx.draw({
    scene: canvas, glow: glow[0].c, time: realTime, beat, fever, boost: boostFx + fever * 0.3, glitch: calm ? glitch * 0.3 : glitch, crt: opts.crt ? 1 : 0,
    letter, hurt, calm: calm ? 1 : 0, bloomK: 1.05 + heat * 2.6 + fever * 2.2, flareK: 0.32 + heat * 1.4 + boostFx * 0.35 + fever * 1.1,
    head: [hx / W, 1 - hy / H], waves: ws, flash: f,
    hues: [hue, pal ? pal[1] : hue + 80, pal ? th.food : hue + FOOD_SHIFT],
    snake: fx.snakeOk ? snakeGeo(g) : null,
    cam: [z, z, (bx + bw / 2) * (1 - z) + shX + camX, (by + bh / 2) * (1 - z) + shY + camY],
    res: [W, H], aa: 1.3 / dpr, snakeHeat: min(1, heat * 3 + fever * 0.35), snakeGlow: 1.1 + fever * 0.9,
    clip: opts.portal ? [bx, by, bw, bh] : null,
    rays: lights, rayK: (0.5 + heat * 2.4 + boostFx * 0.5 + fever * 1.6) * (calm ? 0.3 : 1),
    imp: [impX / W, 1 - impY / H, imp, 0],
  });
}

// ── hud & flow ──────────────────────────────────────────────────────────
function setText(el, v) { v = String(v); if (el._t !== v) { el._t = v; el.textContent = v; } }
function odo(el, v) {   // odometer: each digit is a reel of 0-9 sliding behind its own window
  const s = String(v);
  if (el._s === s) return;
  if (!el._o || el._o.length !== s.length) {            // the number grew or shrank: rebuild the reels
    el.textContent = ''; el._o = [];
    for (let i = 0; i < s.length; i++) {
      const d = document.createElement('span'); d.className = 'd';
      const r = document.createElement('span'); r.className = 'r';
      for (let k = 0; k < 10; k++) r.appendChild(document.createElement('i')).textContent = k;
      d.appendChild(r); el.appendChild(d); el._o.push(d);
    }
  }
  for (let i = 0; i < s.length; i++) {
    const n = s.charCodeAt(i) - 48, d = el._o[i];
    if (d._n !== n) { d._n = n; d.firstChild.style.transform = 'translateY(' + (-n * 10) + '%)'; }
  }
  el._s = s;
}
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

function setMode(m) {
  mode = m; document.body.dataset.mode = m; audio.scene(m);
  // the options travel with whichever card is on screen
  if (m === 'menu') $('menu').querySelector('.panel').insertBefore(settingsEl, menuBestEl);
  else if (m === 'paused' || m === 'over') $(m === 'paused' ? 'pause' : 'over').querySelector('.panel').appendChild(settingsEl);
}
function setGame(g) { G = g; fitBoard(); buildPath(g); }

function updateHud(dt) {
  const g = P, target = g ? g.score : 0;
  if (shownScore !== target) { shownScore += (target - shownScore) * min(1, dt * 14); if (abs(target - shownScore) < 0.6) shownScore = target; }
  odo(scoreEl, round(shownScore)); setText(bestEl, max(best, target));
  const on = !!g && (mode === 'playing' || mode === 'paused') && g.comboT > 0;
  if (on !== comboOn) { comboOn = on; comboEl.classList.toggle('on', on); }
  if (on) { setText(comboXEl, '×' + g.combo); comboBarEl.style.transform = `scaleX(${clamp(g.comboT / g.comboWin, 0, 1).toFixed(3)})`; }
  document.body.classList.toggle('fever', !!g && mode === 'playing' && g.combo >= 6);
  if (mode === 'over' && g) odo(finalEl, round(g.score * outCubic(clamp((realTime - overAt) / 0.9, 0, 1))));
  const e = clamp(g && mode !== 'menu' ? g.energy / 100 : 1, 0, 1).toFixed(3);
  if (energyEl._e !== e) { energyEl._e = e; energyEl.style.transform = `scaleX(${e})`; if (deckH) boostBtn.style.setProperty('--e', e); }
}

// the page chrome follows the hue of the run
function syncCss() {
  const th = opts.theme, h = round(hue);
  if (abs(h - cssHue) < 2 && th === cssTheme) return;
  cssHue = h; cssTheme = th;
  themeMeta.content = hsla(h, 70, 7);
  const s = document.documentElement.style, pal = th.body;
  s.setProperty('--h1', wrap360(h)); s.setProperty('--h2', wrap360(pal ? pal[1] : h + 80)); s.setProperty('--h3', wrap360(pal ? th.food : h + FOOD_SHIFT));
  letters.forEach((el, i) => {
    const a = pal ? paletteHue(pal, i / 4) : h + i * 24, b = pal ? paletteHue(pal, min(1, i / 4 + 0.3)) : h + i * 24 + 52;
    el.style.setProperty('--a', hsla(a, 100, 68)); el.style.setProperty('--b', hsla(b, 100, 57));
  });
}

function showBest() { menuBestEl.textContent = best > 0 ? 'BEST ' + best : ''; }

function startGame(dx, dy) {
  if (mode !== 'menu' && mode !== 'over') return;
  if (mode === 'over' && realTime - overAt < 0.55) return;   // don't let the death-mash restart the run
  P = newGame(false); setGame(P);
  if (dy) P.queue.push({ x: 0, y: dy });
  shownScore = 0; hueTarget = P.hue0; popups.length = streaks.length = afterglow.length = 0; timeScale = 1; hurt = 0;
  const h = P.snake[0];
  ripple(cellX(h.x), cellY(h.y), 0.9, 26, 1.3); ring(cellX(h.x), cellY(h.y), HUE0, cell * 5, 0.7, 3);
  flash = 0.1; flashRGB = '190,255,250'; camZ = calm ? 0 : -0.07;   // the board rushes up to meet you
  setMode('playing'); audio.heat(1); audio.start();
}

function gameOver() {
  const g = P, record = g.score > best;
  if (record) { best = g.score; store.set('best', best); }
  let rank = -1;
  if (g.score > 0) { top3.push(g.score); top3.sort((a, b) => b - a); top3 = top3.slice(0, 3); rank = top3.indexOf(g.score); store.set('top', JSON.stringify(top3)); }
  overTitleEl.textContent = g.perfect ? 'PERFECT RUN' : 'GAME OVER';
  odo(finalEl, 0); newBestEl.classList.toggle('on', record);
  const sec = floor(g.time);
  $('stLen').textContent = g.snake.length; $('stOrbs').textContent = g.eaten; $('stCombo').textContent = '×' + g.comboMax;
  $('stTime').textContent = floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  $('top').innerHTML = top3.length ? '<small>TOP 3</small>' + top3.map((v, i) => `<div class="${i === rank ? 'me' : ''}"><i>${i + 1}</i>${v}</div>`).join('') : '';
  showBest();
  overAt = realTime; demoAt = realTime + 0.9;
  setMode('over');
  if (record) { audio.best(); confetti(); }
}

function pause() {
  if (mode !== 'playing') return;
  if (P.boosting) { P.boosting = false; boostChanged(P); }
  setMode('paused'); audio.blip(false);
}
function resume() { if (mode === 'paused') { setMode('playing'); audio.blip(true); } }

function steer(x, y) {
  if (mode === 'menu') { startGame(x, y); return; }
  if (mode !== 'playing') return;
  const q = P.queue, last = q.length ? q[q.length - 1] : P.dir;
  if (q.length >= 3 || (last.x === x && last.y === y) || (last.x === -x && last.y === -y)) return;
  q.push({ x, y }); audio.turn();
}

function tap() {
  if (mode === 'menu' || mode === 'over') startGame();
  else if (mode === 'paused') resume();
}

// ── input ───────────────────────────────────────────────────────────────
const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  audio.unlock();
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
  const d = KEYS[e.code];
  if (d) { e.preventDefault(); if (!e.repeat) steer(d[0], d[1]); return; }
  if (BOOST_KEYS.includes(e.code)) {
    e.preventDefault();
    if (e.repeat) return;   // a held key that started the run doesn't also fire the boost
    if (mode === 'playing') { boostKeys.add(e.code); syncBoost(); }
    else if (e.code === 'Space') { if (mode === 'paused') resume(); else startGame(); }
  } else if (e.code === 'Enter') { e.preventDefault(); if (!e.repeat) { if (mode === 'paused') resume(); else startGame(); } }
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (mode === 'playing') pause(); else resume(); }
  else if (e.code === 'KeyM') toggleSound();
});
addEventListener('keyup', (e) => { if (boostKeys.delete(e.code)) syncBoost(); });

const BOOST_KEYS = ['Space', 'ShiftLeft', 'ShiftRight'], boostKeys = new Set();
let touchBoost = false;
function syncBoost() { boostHeld = boostKeys.size > 0 || touchBoost; boostBtn.classList.toggle('hot', touchBoost); }

// touch deck: d-pad and a hold-to-boost button whose ring shows the tank
for (const b of deckEl.querySelectorAll('.dpad button')) {
  const [dx, dy] = b.dataset.d.split(',').map(Number), up = () => b.classList.remove('hit');
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault(); audio.unlock(); b.classList.add('hit');
    if (mode === 'paused') resume(); else if (mode === 'over') startGame(); else steer(dx, dy);
  });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(t, up);
}
boostBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault(); audio.unlock();
  if (mode === 'menu' || mode === 'over') { startGame(); return; }
  if (mode === 'paused') { resume(); return; }
  try { boostBtn.setPointerCapture(e.pointerId); } catch (err) {}
  touchBoost = true; syncBoost();
});
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) boostBtn.addEventListener(t, () => { touchBoost = false; syncBoost(); });

// ── options ─────────────────────────────────────────────────────────────
function buildSettings() {
  for (const th of THEMES) {
    const b = document.createElement('button');
    b.className = 'swatch'; b.tabIndex = -1; b.title = th.name; b.dataset.id = th.id;
    b.style.setProperty('--sw', th.sw || `linear-gradient(135deg, ${th.body.map((h) => hsla(h, 100, 58)).join(', ')})`);
    b.style.setProperty('--glow', hsla(th.body ? th.body[0] : 190, 100, 60));
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => { opts.theme = th; store.set('theme', th.id); paintSettings(); audio.blip(true); });
    $('themes').appendChild(b);
  }
  const chip = (id, fn) => $(id).addEventListener('click', () => { audio.unlock(); fn(); paintSettings(); audio.blip(true); });
  chip('optWalls', () => { opts.portal = !opts.portal; store.set('walls', opts.portal ? 'portal' : 'solid'); buildPath(G); });
  chip('optPace', () => { opts.pace = (opts.pace + 1) % PACES.length; store.set('pace', opts.pace); if (P && P.alive) tune(P); });
  chip('optCrt', () => { opts.crt = !opts.crt; store.set('crt', opts.crt ? '1' : '0'); });
  chip('optSfx', () => audio.toggleSfx());
  chip('optMusic', () => audio.toggleMusic());
}

function paintSettings() {
  for (const b of $('themes').children) b.classList.toggle('on', b.dataset.id === opts.theme.id);
  $('themeName').textContent = opts.theme.name;
  const show = (id, on, txt) => { const el = $(id); el.classList.toggle('on', on); el.querySelector('b').textContent = txt; };
  show('optWalls', opts.portal, opts.portal ? 'PORTAL' : 'SOLID');
  show('optPace', opts.pace !== 1, PACES[opts.pace].name);
  show('optCrt', opts.crt, opts.crt ? 'ON' : 'OFF');
  show('optSfx', audio.sfxOn(), audio.sfxOn() ? 'ON' : 'OFF');
  show('optMusic', audio.musicOn(), audio.musicOn() ? 'ON' : 'OFF');
  document.body.classList.toggle('crt-on', opts.crt);
}

let ptr = null;
addEventListener('pointerdown', (e) => {
  audio.unlock();
  if (e.target.closest && e.target.closest('button')) return;
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
});
addEventListener('pointermove', (e) => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, need = e.pointerType === 'mouse' ? 30 : 18;
  if (abs(dx) < need && abs(dy) < need) return;
  ptr.moved = true; ptr.x = e.clientX; ptr.y = e.clientY;   // re-anchor so swipes chain without lifting
  if (abs(dx) > abs(dy)) steer(dx > 0 ? 1 : -1, 0); else steer(0, dy > 0 ? 1 : -1);
});
addEventListener('pointerup', (e) => {
  audio.unlock();
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.moved) tap();
  ptr = null;
});
addEventListener('pointercancel', () => { ptr = null; });

function toggleSound() { audio.unlock(); document.body.classList.toggle('muted', audio.toggle()); }
const logo = document.querySelector('.logo');
addEventListener('pointermove', (e) => {   // the title leans toward the pointer
  if (e.pointerType !== 'mouse' || mode !== 'menu' || calm) return;
  logo.style.setProperty('--ry', ((e.clientX / W - 0.5) * 16).toFixed(2) + 'deg');
  logo.style.setProperty('--rx', ((0.5 - e.clientY / H) * 12).toFixed(2) + 'deg');
});
for (const b of document.querySelectorAll('button')) b.addEventListener('mousedown', (e) => e.preventDefault());   // keep focus off buttons
$('btnPlay').addEventListener('click', () => { audio.unlock(); startGame(); });
$('btnAgain').addEventListener('click', () => { audio.unlock(); startGame(); });
$('btnSound').addEventListener('click', toggleSound);
$('btnPause').addEventListener('click', () => { audio.unlock(); if (mode === 'playing') pause(); else resume(); });

addEventListener('blur', () => { boostKeys.clear(); touchBoost = false; syncBoost(); pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); audio.sleep(document.hidden); });
addEventListener('resize', () => {
  metrics();
  if (G.demo) { const [c, r] = gridFor(); if (c !== G.cols || r !== G.rows) { G = newGame(true); parts.length = rings.length = ripples.length = 0; } }
  layout(); buildPath(G);
});

// ── main loop ───────────────────────────────────────────────────────────
function tick(dt) {
  realTime += dt;
  beat = audio.pulse(realTime);
  if (mode !== 'paused') {
    let gdt = dt * timeScale;
    if (freeze > 0) { freeze -= dt; gdt = 0; } else timeScale = min(1, timeScale + dt * 1.1);
    shake *= exp(-dt * 7.5); punch *= exp(-dt * 11); flash *= exp(-dt * 7); hurt *= exp(-dt * 2.2);
    glitch = max(0, glitch - dt * 2.6);
    imp = max(0, imp - dt * 6.5);
    updateGame(G, gdt, dt);
    updateFx(gdt);
    if (!G.alive && !G.done && G.dieT > G.dieEnd) { G.done = true; if (G.demo) setGame(newGame(true)); else gameOver(); }
    if (mode === 'over' && !G.demo && realTime >= demoAt) setGame(newGame(true));
    buildPath(G);
    if (!G.alive) dissolveFx(G);
  }
  const th = opts.theme;
  // fever: the overload level, driven by the combo and overdrive; the beat rides it up and down
  if (mode !== 'paused') {
    const ft = min(1, (P && mode === 'playing' ? max(0, P.combo - 1) / 7 : 0) * 0.9 + boostFx * 0.3) * (calm ? 0.35 : 1);
    fever += (ft - fever) * min(1, dt * 5);
    if (!calm) { shake = max(shake, fever * beat * 1.1); punch = max(punch, fever * beat * 0.004); }
  }
  if (th.body) hue = turnTo(hue, th.body[0], 1 - exp(-dt * 5), 360);
  else if (th.id === 'rainbow') hue = wrap360(realTime * 36);
  else hue = turnTo(hue, hueTarget, 1 - exp(-dt * 2.5), 360);
  if (!th.body && !calm) hue = wrap360(hue + dt * 150 * fever);   // themes without a pinned hue spin with the combo
  boostFx += ((G.boosting ? 1 : 0) - boostFx) * min(1, dt * 8);
  letter += ((mode === 'dying' ? 1 : 0) - letter) * min(1, dt * (mode === 'dying' ? 7 : 3));
  if (PN && !calm) {
    const hx = bx + (wrapC(PX[0], G.cols) + 0.5) * cell, hy = by + (wrapC(PY[0], G.rows) + 0.5) * cell, e = 1 - exp(-dt * 2.2);
    const zoom = mode === 'playing' ? min(P.combo - 1, 10) * 0.0025 + boostFx * 0.012 + fever * 0.01 * beat : 0;
    camX += ((bx + bw / 2 - hx) * 0.012 - camX) * e; camY += ((by + bh / 2 - hy) * 0.012 - camY) * e; camZ += (zoom - camZ) * (1 - exp(-dt * 3));
  }
  updateHud(dt); syncCss();
}

let lastTs = 0, cost = 0, slowFor = 0, pace = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!(dt > 0)) return;
  if (dt > 0.25) dt = 1 / 60;                 // came back from a hidden tab
  const t0 = performance.now();
  tick(min(dt, 0.05)); render();
  // if drawing itself is eating the frame budget, trade resolution for speed
  cost += (performance.now() - t0 - cost) * 0.05;
  pace += (dt - pace) * 0.05;
  slowFor = cost > 14 || pace > 0.026 ? slowFor + dt : 0;
  if (slowFor > 2 && quality > 0.5) { quality -= 0.25; slowFor = 0; cost = 0; layout(); }
}

// ── boot ────────────────────────────────────────────────────────────────
(() => {   // film grain, generated once
  const n = 160, cv = mkCanvas(n, n), im = cv.x.createImageData(n, n), d = im.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = Math.random() * 255; d[i + 3] = Math.random() * 18; }
  cv.x.putImageData(im, 0, 0);
  $('grain').style.backgroundImage = `url(${cv.c.toDataURL()})`;
})();

document.body.classList.toggle('coarse', coarse);
document.body.classList.toggle('muted', audio.muted());
buildSettings(); paintSettings();
if (fx.ok) { fx.cv.id = 'g'; canvas.after(fx.cv); document.body.classList.add('gl'); }
showBest();
metrics();
G = newGame(true);
layout(); buildPath(G); syncCss();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
